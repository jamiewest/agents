name: agents_flutter
description: >-
  Flutter integration for the agents framework: a preconfigured harness agent,
  device-capability context providers and tools, chat history persistence, and
  configurable model profiles.
version: 0.8.1
repository: https://github.com/jamiewest/agents
issue_tracker: https://github.com/jamiewest/agents/issues
resolution: workspace

topics:
  - ai
  - agents
  - llm
  - chat

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  a2a: ^4.2.0
  agents: ^2.0.0
  anthropic_sdk_dart: ^6.0.0
  archive: ^4.0.9
  background_downloader: ^9.5.5
  characters: ^1.4.1
  pool: ^1.5.2
  shelf: ^1.4.2
  clock: ^1.1.2
  connectivity_plus: ^7.1.1
  cross_file: ^0.3.5+2
  crypto: ^3.0.7
  device_info_plus: ^13.2.0
  extensions: ^0.6.0
  extensions_flutter: ^0.5.0
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.2
  mime: ^2.0.0
  network_info_plus: ^8.1.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  sembast: ^3.8.9+1
  sembast_web: ^2.4.5+1
  shared_preferences: ^2.5.5
  timezone: ^0.11.0
  wakelock_plus: ^1.6.1

dev_dependencies:
  fake_async: ^1.3.1
  file: ^7.0.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

